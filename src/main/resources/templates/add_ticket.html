<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Nova Solicitação - bit Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .text-brand { color: #2563eb; font-weight: 700; }
        .form-card { border-radius: 16px; border: 1px solid rgba(0,0,0,0.1); }
        .btn-brand { background-color: #2563eb; border-color: #2563eb; color: white; }
        .btn-brand:hover { background-color: #1d4ed8; color: white; }
    </style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-body shadow-sm mb-5">
    <div class="container">
        <a class="navbar-brand text-brand fs-4" href="/"><i class="bi bi-headset"></i> bit Soluções</a>
        <div class="navbar-nav ms-auto d-flex align-items-center flex-row gap-3">
            <button class="btn btn-light btn-sm border" onclick="toggleDarkMode()" id="darkModeToggle">
                <i class="bi bi-moon-fill"></i>
            </button>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm form-card p-4 bg-body">
                <h3 class="text-brand mb-1"><i class="bi bi-plus-circle-fill"></i> Registrar Nova Solicitação</h3>
                <p class="text-muted mb-4 small">Descreva sua demanda interna para atendimento</p>

                <form th:action="@{/tickets}" th:object="${ticketForm}" method="post">

                    <div class="mb-3">
                        <label for="titulo" class="form-label small text-muted">Título</label>
                        <input type="text" id="titulo" th:field="*{titulo}" class="form-control bg-body-tertiary" placeholder="Ex: Ajuste no acesso ao RM" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{titulo}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="categoriaId" class="form-label small text-muted">Categoria</label>
                        <select id="categoriaId" th:field="*{categoriaId}" class="form-select bg-body-tertiary" th:errorclass="is-invalid">
                            <option value="">Selecione uma categoria...</option>
                            <option value="1">TI</option>
                            <option value="2">RH</option>
                            <option value="3">Compras</option>
                            <option value="4">Financeiro</option>
                            <option value="5">Infraestrutura</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{categoriaId}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="descricao" class="form-label small text-muted">Descrição Detalhada</label>
                        <textarea id="descricao" th:field="*{descricao}" class="form-control bg-body-tertiary" rows="5" placeholder="Descreva os detalhes da sua demanda..." th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:errors="*{descricao}"></div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-brand w-50"><i class="bi bi-check-circle-fill"></i> Criar Solicitação</button>
                        <a href="/tickets" class="btn btn-outline-secondary w-50">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const htmlElement = document.documentElement;
    const toggleIcon = document.querySelector('#darkModeToggle i');
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.setAttribute('data-bs-theme', 'dark');
        toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
    }
    function toggleDarkMode() {
        if (htmlElement.getAttribute('data-bs-theme') === 'light') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
        } else {
            htmlElement.setAttribute('data-bs-theme', 'light');
            localStorage.setItem('theme', 'light');
            toggleIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
        }
    }
</script>
</body>
</html>
