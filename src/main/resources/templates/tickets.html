<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento - bit Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .text-brand { color: #2563eb; font-weight: 700; }
        .table-custom th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #2563eb; cursor: pointer; }
        .table-custom th:hover { background-color: rgba(37,99,235,0.1) !important; }
        .badge-soft-warning { background-color: rgba(255,193,7,0.2); color: #b08a00; border: 1px solid rgba(255,193,7,0.5); }
        .badge-soft-info { background-color: rgba(13,202,240,0.2); color: #087990; border: 1px solid rgba(13,202,240,0.5); }
        .badge-soft-success { background-color: rgba(25,135,84,0.2); color: #146c43; border: 1px solid rgba(25,135,84,0.5); }
        .badge-soft-primary { background-color: rgba(37,99,235,0.1); color: #2563eb; }
    </style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-body shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-brand fs-4" href="/"><i class="bi bi-headset"></i> bit Soluções</a>
        <div class="navbar-nav ms-auto d-flex align-items-center flex-row gap-3">
            <a class="btn btn-outline-primary btn-sm" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <button class="btn btn-light btn-sm border" onclick="toggleDarkMode()" id="darkModeToggle">
                <i class="bi bi-moon-fill"></i>
            </button>
            <span class="text-muted small"><i class="bi bi-person-circle"></i> <span th:text="${#authentication.name}">colaborador</span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-list-task text-brand"></i> Gerenciamento de Solicitações</h2>
            <p class="text-muted">Acompanhe e filtre as demandas registradas</p>
        </div>
        <a href="/tickets/novo" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nova Solicitação</a>
    </div>

    <div class="card shadow-sm border-0 mb-4 rounded-3">
        <div class="card-body">
            <h6 class="text-brand mb-3"><i class="bi bi-funnel-fill"></i> Filtros e Ordenação</h6>
            <form id="filterForm" th:action="@{/tickets}" method="get" class="row g-3 align-items-end">

                <input type="hidden" name="orderBy" id="orderBy" th:value="${param.orderBy != null ? param.orderBy : 'data'}">

                <div class="col-md-3">
                    <label class="form-label small text-muted">Título</label>
                    <input type="text" name="titulo" class="form-control" placeholder="Buscar..." th:value="${param.titulo}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Categoria</label>
                    <select name="categoria" class="form-select">
                        <option value="">Todas</option>
                        <option value="1" th:selected="${param.categoria != null and param.categoria[0] == '1'}">TI</option>
                        <option value="2" th:selected="${param.categoria != null and param.categoria[0] == '2'}">RH</option>
                        <option value="3" th:selected="${param.categoria != null and param.categoria[0] == '3'}">Compras</option>
                        <option value="4" th:selected="${param.categoria != null and param.categoria[0] == '4'}">Financeiro</option>
                        <option value="5" th:selected="${param.categoria != null and param.categoria[0] == '5'}">Infraestrutura</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Status</label>
                    <select name="status" class="form-select">
                        <option value="">Todos</option>
                        <option value="ABERTO" th:selected="${param.status != null and param.status[0] == 'ABERTO'}">Aberto</option>
                        <option value="EM_ATENDIMENTO" th:selected="${param.status != null and param.status[0] == 'EM_ATENDIMENTO'}">Em Atendimento</option>
                        <option value="CONCLUIDO" th:selected="${param.status != null and param.status[0] == 'CONCLUIDO'}">Concluído</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Data Inicial</label>
                    <input type="date" name="dataInicio" class="form-control" th:value="${param.dataInicio}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted">Data Final</label>
                    <input type="date" name="dataFim" class="form-control" th:value="${param.dataFim}">
                </div>
                <div class="col-md-1 d-grid">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 bg-body">
                <thead class="table-light table-custom">
                <tr>
                    <th class="ps-4" onclick="document.getElementById('orderBy').value='id'; document.getElementById('filterForm').submit();">Código <i class="bi bi-arrow-down-up"></i></th>
                    <th onclick="document.getElementById('orderBy').value='titulo'; document.getElementById('filterForm').submit();">Título <i class="bi bi-arrow-down-up"></i></th>
                    <th onclick="document.getElementById('orderBy').value='categoria'; document.getElementById('filterForm').submit();">Categoria <i class="bi bi-arrow-down-up"></i></th>
                    <th onclick="document.getElementById('orderBy').value='solicitante'; document.getElementById('filterForm').submit();">Solicitante <i class="bi bi-arrow-down-up"></i></th>
                    <th onclick="document.getElementById('orderBy').value='data'; document.getElementById('filterForm').submit();">Data de Abertura <i class="bi bi-arrow-down-up"></i></th>
                    <th onclick="document.getElementById('orderBy').value='status'; document.getElementById('filterForm').submit();">Status <i class="bi bi-arrow-down-up"></i></th>
                    <th class="text-end pe-4" style="cursor: default;">Ações</th>
                </tr>
                </thead>
                <tbody class="border-top-0">
                <tr th:each="t : ${tickets}">
                    <td class="ps-4 text-muted fw-bold" th:text="'#' + ${t.id}">#1</td>
                    <td class="fw-bold" th:text="${t.title}">Título</td>
                    <td><span class="badge badge-soft-primary rounded-pill px-3" th:text="${t.category.name}">TI</span></td>
                    <td th:text="${t.user.username}">usuario</td>
                    <td class="text-muted" th:text="${#temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm')}">Data</td>
                    <td>
                                <span class="badge rounded-pill px-3"
                                      th:classappend="${t.status.name() == 'ABERTO' ? 'badge-soft-warning' : (t.status.name() == 'EM_ATENDIMENTO' ? 'badge-soft-info' : 'badge-soft-success')}"
                                      th:text="${t.status.name() == 'EM_ATENDIMENTO' ? 'Em Atendimento' : t.status}">ABERTO</span>
                    </td>
                    <td class="text-end pe-4">
                        <div class="d-flex justify-content-end gap-1">

                            <a th:href="@{/tickets/{id}(id=${t.id})}" class="btn btn-sm btn-outline-secondary" title="Visualizar"><i class="bi bi-eye"></i></a>

                            <div class="dropdown">
                                <button class="btn btn-sm btn-outline-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">Status</button>
                                <ul class="dropdown-menu dropdown-menu-end shadow">
                                    <li>
                                        <form th:action="@{/tickets/{id}/status(id=${t.id})}" method="post">
                                            <input type="hidden" name="status" value="ABERTO">
                                            <button type="submit" class="dropdown-item small"><i class="bi bi-circle text-warning"></i> Aberto</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/tickets/{id}/status(id=${t.id})}" method="post">
                                            <input type="hidden" name="status" value="EM_ATENDIMENTO">
                                            <button type="submit" class="dropdown-item small"><i class="bi bi-gear-wide-connected text-info"></i> Em Atendimento</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/tickets/{id}/status(id=${t.id})}" method="post">
                                            <input type="hidden" name="status" value="CONCLUIDO">
                                            <button type="submit" class="dropdown-item small"><i class="bi bi-check-circle text-success"></i> Concluído</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>

                            <a th:href="@{/tickets/{id}/edit(id=${t.id})}" class="btn btn-sm btn-primary" title="Editar"><i class="bi bi-pencil-square"></i> Editar</a>

                            <form th:if="${t.status.name() == 'ABERTO'}" th:action="@{/tickets/{id}/delete(id=${t.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir" onclick="return confirm('Tem certeza?')"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const htmlElement = document.documentElement;
    const toggleIcon = document.querySelector('#darkModeToggle i');
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.setAttribute('data-bs-theme', 'dark');
        toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
    }
    function toggleDarkMode() {
        if (htmlElement.getAttribute('data-bs-theme') === 'light') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
        } else {
            htmlElement.setAttribute('data-bs-theme', 'light');
            localStorage.setItem('theme', 'light');
            toggleIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
        }
    }
</script>
</body>
</html>
