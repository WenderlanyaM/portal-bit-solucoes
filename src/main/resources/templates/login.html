<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Login - bit Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { border-radius: 12px; border: 1px solid #dee2e6; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .text-brand { color: #2563eb; font-weight: 700; }
        .btn-brand { background-color: #2563eb; border-color: #2563eb; color: white; font-weight: 600; }
        .btn-brand:hover { background-color: #1d4ed8; color: white; }
    </style>
</head>
<body class="d-flex align-items-center py-4" style="height: 100vh;">
<main class="w-100 m-auto" style="max-width: 400px;">
    <div class="text-center mb-4">
        <h1 class="text-brand display-5"><i class="bi bi-headset"></i> bit Soluções</h1>
        <p class="text-muted">Portal de Solicitações Internas</p>
    </div>

    <div class="card login-card p-4">
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert alert-danger p-2 text-center small">Credenciais inválidas.</div>
            <div th:if="${param.logout}" class="alert alert-success p-2 text-center small">Desconectado com sucesso.</div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-person-fill text-muted"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Digite seu usuário" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-lock-fill text-muted"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="Digite sua senha" required>
                </div>
            </div>

            <button class="w-100 btn btn-brand btn-lg" type="submit">
                <i class="bi bi-box-arrow-in-right"></i> Acessar Portal
            </button>
        </form>
    </div>
</main>
</body>
</html>
