<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Solicitação - bit Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>.text-brand { color: #2563eb; font-weight: 700; }</style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-body shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-brand fs-4" href="/"><i class="bi bi-headset"></i> bit Soluções</a>
        <div class="navbar-nav ms-auto d-flex align-items-center flex-row gap-3">
            <button class="btn btn-light btn-sm border" onclick="toggleDarkMode()" id="darkModeToggle">
                <i class="bi bi-moon-fill"></i>
            </button>
        </div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow-sm border-0 rounded-4 p-4 bg-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="text-brand m-0"><i class="bi bi-journal-text"></i> Solicitação #<span th:text="${ticket.id}"></span></h3>
            <span class="badge bg-primary rounded-pill px-3 py-2" th:text="${ticket.status}"></span>
        </div>
        <hr>
        <div class="mb-3">
            <label class="text-muted small fw-bold text-uppercase">Título</label>
            <p class="fs-5 fw-bold" th:text="${ticket.title}">Título da Solicitação</p>
        </div>
        <div class="row mb-3">
            <div class="col-6">
                <label class="text-muted small fw-bold text-uppercase">Categoria</label>
                <p th:text="${ticket.category.name}">TI</p>
            </div>
            <div class="col-6">
                <label class="text-muted small fw-bold text-uppercase">Solicitante</label>
                <p th:text="${ticket.user.username}">Usuário</p>
            </div>
        </div>
        <div class="mb-4">
            <label class="text-muted small fw-bold text-uppercase">Descrição</label>
            <div class="p-3 bg-body-tertiary rounded border" style="min-height: 100px; white-space: pre-wrap;" th:text="${ticket.description}">
                Descrição detalhada...
            </div>
        </div>
        <div class="text-end">
            <a href="/tickets" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
        </div>
    </div>
</div>

<script>
    const htmlElement = document.documentElement;
    const toggleIcon = document.querySelector('#darkModeToggle i');
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.setAttribute('data-bs-theme', 'dark');
        toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
    }
    function toggleDarkMode() {
        if (htmlElement.getAttribute('data-bs-theme') === 'light') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
        } else {
            htmlElement.setAttribute('data-bs-theme', 'light');
            localStorage.setItem('theme', 'light');
            toggleIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
        }
    }
</script>
</body>
</html>
