<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - bit Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .text-brand { color: #2563eb; font-weight: 700; }
        .metric-card { border-radius: 12px; border-width: 2px; }
        .card-total { border-color: #0d6efd; color: #0d6efd; }
        .card-abertas { border-color: #ffc107; color: #ffc107; }
        .card-atendimento { border-color: #0dcaf0; color: #0dcaf0; }
        .card-concluidas { border-color: #198754; color: #198754; }
    </style>
</head>
<body class="bg-body-tertiary">
<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-body shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-brand fs-4" href="/"><i class="bi bi-headset"></i> bit Soluções</a>
        <div class="navbar-nav ms-auto d-flex align-items-center flex-row gap-3">
            <a class="btn btn-outline-primary btn-sm" href="/tickets"><i class="bi bi-list-ul"></i> Solicitações</a>
            <button class="btn btn-light btn-sm border" onclick="toggleDarkMode()" id="darkModeToggle">
                <i class="bi bi-moon-fill"></i>
            </button>
            <span class="text-muted small"><i class="bi bi-person-circle"></i> <span th:text="${#authentication.name}">colaborador</span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="bi bi-speedometer2 text-brand"></i> Dashboard de Indicadores</h2>
            <p class="text-muted">Visão geral do volume de demandas internas</p>
        </div>
        <a href="/tickets/novo" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nova Solicitação</a>
    </div>

    <div class="row mb-4 g-3">
        <div class="col-md-3">
            <div class="card metric-card card-total p-3 bg-body shadow-sm h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="small fw-bold text-muted text-uppercase">Total</span>
                        <h2 class="display-5 fw-bold mb-0" th:text="${tickets.size()}">0</h2>
                    </div>
                    <i class="bi bi-folder-fill fs-1"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card metric-card card-abertas p-3 bg-body shadow-sm h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="small fw-bold text-muted text-uppercase">Abertas</span>
                        <h2 class="display-5 fw-bold mb-0" th:text="${estatisticas.get(T(info.bitsolucoes.portal.model.StatusSolicitacao).ABERTO)}">0</h2>
                    </div>
                    <i class="bi bi-exclamation-circle-fill fs-1"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card metric-card card-atendimento p-3 bg-body shadow-sm h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="small fw-bold text-muted text-uppercase">Em Atendimento</span>
                        <h2 class="display-5 fw-bold mb-0" th:text="${estatisticas.get(T(info.bitsolucoes.portal.model.StatusSolicitacao).EM_ATENDIMENTO)}">0</h2>
                    </div>
                    <i class="bi bi-gear-fill fs-1"></i>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card metric-card card-concluidas p-3 bg-body shadow-sm h-100">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="small fw-bold text-muted text-uppercase">Concluídas</span>
                        <h2 class="display-5 fw-bold mb-0" th:text="${estatisticas.get(T(info.bitsolucoes.portal.model.StatusSolicitacao).CONCLUIDO)}">0</h2>
                    </div>
                    <i class="bi bi-check-circle-fill fs-1"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Lógica do Dark Mode
    const htmlElement = document.documentElement;
    const toggleIcon = document.querySelector('#darkModeToggle i');

    // Verifica preferência salva
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.setAttribute('data-bs-theme', 'dark');
        toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
    }

    function toggleDarkMode() {
        if (htmlElement.getAttribute('data-bs-theme') === 'light') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
        } else {
            htmlElement.setAttribute('data-bs-theme', 'light');
            localStorage.setItem('theme', 'light');
            toggleIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
        }
    }
</script>
</body>
</html>
