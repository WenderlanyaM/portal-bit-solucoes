<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Editar Solicitação - bit Soluções</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>.text-brand { color: #2563eb; font-weight: 700; }</style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-body shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-brand fs-4" href="/"><i class="bi bi-headset"></i> bit Soluções</a>
        <div class="navbar-nav ms-auto d-flex align-items-center flex-row gap-3">
            <button class="btn btn-light btn-sm border" onclick="toggleDarkMode()" id="darkModeToggle">
                <i class="bi bi-moon-fill"></i>
            </button>
        </div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4 p-4 bg-body">
        <h3 class="text-brand mb-4"><i class="bi bi-pencil-square"></i> Editar Solicitação #<span th:text="${ticket.id}"></span></h3>

        <form th:action="@{/tickets/{id}/edit(id=${ticket.id})}" method="post">
            <div class="mb-3">
                <label for="title" class="form-label small text-muted fw-bold">Título</label>
                <input type="text" id="title" name="title" th:value="${ticket.title}" class="form-control bg-body-tertiary" required>
            </div>
            <div class="mb-4">
                <label for="description" class="form-label small text-muted fw-bold">Descrição</label>
                <textarea id="description" name="description" class="form-control bg-body-tertiary" rows="5" required th:text="${ticket.description}"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary w-50"><i class="bi bi-save"></i> Atualizar Dados</button>
                <a href="/tickets" class="btn btn-outline-secondary w-50">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    const htmlElement = document.documentElement;
    const toggleIcon = document.querySelector('#darkModeToggle i');
    if (localStorage.getItem('theme') === 'dark') {
        htmlElement.setAttribute('data-bs-theme', 'dark');
        toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
    }
    function toggleDarkMode() {
        if (htmlElement.getAttribute('data-bs-theme') === 'light') {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            toggleIcon.classList.replace('bi-moon-fill', 'bi-sun-fill');
        } else {
            htmlElement.setAttribute('data-bs-theme', 'light');
            localStorage.setItem('theme', 'light');
            toggleIcon.classList.replace('bi-sun-fill', 'bi-moon-fill');
        }
    }
</script>
</body>
</html>
