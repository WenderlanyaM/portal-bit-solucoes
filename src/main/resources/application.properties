# Configuração de Conexão com MariaDB apontando para o serviço 'db' do Docker Compose
spring.datasource.url=${DB_URL:jdbc:mariadb://db:3306/portal_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:usuario123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Flyway Migration
spring.flyway.enabled=true

# Habilitação das Virtual Threads do Java 21 (Alta performance de concorrência)
spring.threads.virtual.enabled=true

spring.mvc.problemdetails.enabled=true